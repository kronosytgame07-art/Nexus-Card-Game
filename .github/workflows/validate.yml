name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and Vite web build
        run: npm run build

      - name: Verify web assets
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/cards/louve-veilleuse.png
          test -f dist/cards/evo-louve-veilleuse.png
          test -f dist/cards/eclaireuse-des-crocs.png
          test -f dist/cards/mythique-loup-du-nexus.png
          test -f dist/boosters/meute.png
          test -f dist/boosters/chevalier.png
          test -f dist/boosters/orc.png
          test -f dist/boosters/dragon.png
          test -f dist/boosters/gobelin.png
          grep -q "nexus-arena-v20" dist/sw.js

      - name: Capacitor build and sync
        run: npm run build:capacitor

      - name: Verify native assets are the new assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          checks = [
              ('public/cards/louve-veilleuse.png', [
                  'android/app/src/main/assets/public/cards/louve-veilleuse.png',
                  'ios/App/App/public/cards/louve-veilleuse.png',
              ]),
              ('public/cards/mythique-loup-du-nexus.png', [
                  'android/app/src/main/assets/public/cards/mythique-loup-du-nexus.png',
                  'ios/App/App/public/cards/mythique-loup-du-nexus.png',
              ]),
              ('public/boosters/meute.png', [
                  'android/app/src/main/assets/public/boosters/meute.png',
                  'ios/App/App/public/boosters/meute.png',
              ]),
          ]

          for src_name, targets in checks:
              src = Path(src_name)
              if not src.exists():
                  raise SystemExit(f'Source absente: {src}')
              src_hash = hashlib.sha256(src.read_bytes()).hexdigest()
              existing = [Path(p) for p in targets if Path(p).exists()]
              if not existing:
                  raise SystemExit(f'Aucune copie native trouvée pour {src}')
              for target in existing:
                  target_hash = hashlib.sha256(target.read_bytes()).hexdigest()
                  if target_hash != src_hash:
                      raise SystemExit(f'Asset natif différent de la source: {target}')
                  print('OK', target)
          PY

      - name: Guard against legacy image injectors
        run: |
          set -euo pipefail
          test ! -e scripts/copy-card-art.sh
          test ! -e .github/workflows/integrate-meute-assets.yml
          test ! -e .github/workflows/integrate-meute-images.yml
          test ! -e .github/workflows/trigger-meute-integration.yml
          test ! -e .github/workflows/update-booster-ui.yml
          legacy_refs="$({ grep -R -n --exclude='validate.yml' "copy-card-art.sh" package.json .github/workflows || true; } | grep -v -E '^[^:]+:[0-9]+:[[:space:]]*#' || true)"
          if [ -n "$legacy_refs" ]; then
            echo "$legacy_refs"
            echo "Ancienne référence exécutable copy-card-art.sh détectée"
            exit 1
          fi
