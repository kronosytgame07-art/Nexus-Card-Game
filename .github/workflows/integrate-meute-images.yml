name: Intégrer illustrations Meute

on:
  push:
    paths:
      - '.github/workflows/integrate-meute-images.yml'
      - 'scripts/integrate-meute-images.py'
      - 'Nexus_Images_Final_Lot_*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Intégrer les PNG
        run: python3 scripts/integrate-meute-images.py

      - name: Vérifier les assets produits
        run: |
          test -f public/cards/louve-veilleuse.png
          test -f public/cards/evo-louve-veilleuse.png
          test -f public/cards/eclaireuse-des-crocs.png
          test -f public/cards/mythique-loup-du-nexus.png
          test -f public/boosters/meute.png
          count=$(find public/cards -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "PNG cartes présents : $count"

      - name: Commit des illustrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards public/boosters
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Intègre les 42 nouvelles illustrations Nexus Arena"
          git push
