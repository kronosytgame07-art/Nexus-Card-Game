name: Build Android (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build le web app (avec les illustrations de cartes) et synchroniser la plateforme Android
        run: npm run build:capacitor
      - name: Compiler l'APK debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-card-arena-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
