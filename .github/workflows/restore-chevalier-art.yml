name: Restaurer illustrations Chevalier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-chevalier-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurer définitivement les PNG Chevalier dans public/cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/cards
          cp "ChatGPT Image 6 août 2026, 03_35_03.png" public/cards/ecuyer-dore.png
          cp "ChatGPT Image 6 août 2026, 03_35_14.png" public/cards/novice-du-serment.png
          cp "ChatGPT Image 6 août 2026, 03_43_44.png" public/cards/lame-blanche.png
          cp "ChatGPT Image 6 août 2026, 03_44_26.png" public/cards/garde-du-portail.png
          cp "ChatGPT Image 6 août 2026, 03_45_13.png" public/cards/paladin-des-cendres.png
          cp "ChatGPT Image 6 août 2026, 03_46_00.png" public/cards/chevalier-azur.png
          cp "ChatGPT Image 6 août 2026, 03_46_51.png" public/cards/porte-etendard.png
          cp "ChatGPT Image 6 août 2026, 03_47_40.png" public/cards/sentinelle-doree.png
          cp "ChatGPT Image 6 août 2026, 03_53_25.png" public/cards/duelliste-royal.png
          cp "ChatGPT Image 6 août 2026, 03_54_22.png" public/cards/capitaine-du-royaume.png

          cp "ChatGPT Image 6 août 2026, 04_08_43.png" public/cards/evo-novice-du-serment.png
          cp "ChatGPT Image 6 août 2026, 04_09_45.png" public/cards/evo-lame-blanche.png
          cp "ChatGPT Image 6 août 2026, 04_10_59.png" public/cards/evo-garde-du-portail.png
          cp "ChatGPT Image 6 août 2026, 04_11_57.png" public/cards/evo-paladin-des-cendres.png
          cp "ChatGPT Image 6 août 2026, 04_12_54.png" public/cards/evo-chevalier-azur.png
          cp "ChatGPT Image 6 août 2026, 04_13_53.png" public/cards/evo-porte-etendard.png
          cp "ChatGPT Image 6 août 2026, 04_14_54.png" public/cards/evo-sentinelle-doree.png
          cp "ChatGPT Image 6 août 2026, 04_15_53.png" public/cards/evo-duelliste-royal.png
          cp "ChatGPT Image 6 août 2026, 04_16_53.png" public/cards/evo-capitaine-du-royaume.png
          cp "ChatGPT Image 6 août 2026, 04_22_05.png" public/cards/evo-ecuyer-dore.png

          cp "ChatGPT Image 6 août 2026, 04_24_32.png" public/cards/ordre-de-ralliement.png
          cp "ChatGPT Image 6 août 2026, 04_27_07.png" public/cards/grande-bibliotheque.png
          cp "ChatGPT Image 6 août 2026, 04_28_14.png" public/cards/bouclier-de-lumiere.png
          cp "ChatGPT Image 6 août 2026, 04_31_16.png" public/cards/jugement-solaire.png
          cp "ChatGPT Image 6 août 2026, 04_32_07.png" public/cards/banniere-du-royaume.png
          cp "ChatGPT Image 6 août 2026, 04_33_00.png" public/cards/sceau-immobilite.png
          cp "ChatGPT Image 6 août 2026, 04_34_04.png" public/cards/aube-victorieuse.png
          cp "ChatGPT Image 6 août 2026, 04_35_11.png" public/cards/reliquaire-du-roi.png
          cp "ChatGPT Image 6 août 2026, 04_36_37.png" public/cards/serment-de-garde.png
          cp "ChatGPT Image 6 août 2026, 04_44_24.png" public/cards/voie-du-paladin.png

          test "$(find public/cards -maxdepth 1 -type f -name '*.png' | grep -E '/(ecuyer-dore|novice-du-serment|lame-blanche|garde-du-portail|paladin-des-cendres|chevalier-azur|porte-etendard|sentinelle-doree|duelliste-royal|capitaine-du-royaume|evo-novice-du-serment|evo-lame-blanche|evo-garde-du-portail|evo-paladin-des-cendres|evo-chevalier-azur|evo-porte-etendard|evo-sentinelle-doree|evo-duelliste-royal|evo-capitaine-du-royaume|evo-ecuyer-dore|ordre-de-ralliement|grande-bibliotheque|bouclier-de-lumiere|jugement-solaire|banniere-du-royaume|sceau-immobilite|aube-victorieuse|reliquaire-du-roi|serment-de-garde|voie-du-paladin)\.png$' | wc -l)" -eq 30

      - name: Vérifier le build web
        run: |
          npm ci
          npm run build
          test -f dist/cards/ecuyer-dore.png
          test -f dist/cards/evo-ecuyer-dore.png
          test -f dist/cards/voie-du-paladin.png

      - name: Commit permanent
        run: |
          rm -f .github/workflows/restore-chevalier-art.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/cards .github/workflows/restore-chevalier-art.yml
          git commit -m 'Restaure définitivement les 30 illustrations Chevalier'
          git push origin HEAD:main
