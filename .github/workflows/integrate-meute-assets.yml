name: Intégrer les visuels Meute

on:
  push:
    paths:
      - '.github/workflows/integrate-meute-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow
        run: python -m pip install --quiet pillow

      - name: Extraire, mapper et optimiser les images
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .nexus-assets-tmp
          mkdir -p .nexus-assets-tmp public/cards public/boosters
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from PIL import Image

          root = Path('.')
          tmp = root / '.nexus-assets-tmp'
          tmp.mkdir(exist_ok=True)

          zips = sorted(root.glob('Nexus_Images_Final_Lot_*.zip'))
          if len(zips) < 9:
              raise SystemExit(f'ERREUR: 9 ZIP attendus, {len(zips)} trouvés: {[z.name for z in zips]}')

          for zpath in zips:
              with zipfile.ZipFile(zpath) as z:
                  z.extractall(tmp)

          sources = {p.name: p for p in tmp.rglob('*.png')}
          print(f'{len(sources)} PNG uniques extraits')
          if len(sources) < 45:
              raise SystemExit(f'ERREUR: 45 PNG attendus, {len(sources)} trouvés')

          cards = {
              'louve-veilleuse.png': 'ChatGPT Image 8 août 2026, 17_25_52(1).png',
              'loup-eclaireur.png': 'ChatGPT Image 8 août 2026, 17_25_47(1).png',
              'jeune-croc.png': 'ChatGPT Image 8 août 2026, 17_26_07(1).png',
              'loup-des-brumes.png': 'ChatGPT Image 8 août 2026, 17_25_39(1).png',
              'chasseuse-grise.png': 'ChatGPT Image 8 août 2026, 17_25_31(1).png',
              'loup-de-givre.png': 'ChatGPT Image 8 août 2026, 17_25_27(1).png',
              'pisteur-alpha.png': 'ChatGPT Image 8 août 2026, 17_25_20.png',
              'loup-sentinelle.png': 'ChatGPT Image 8 août 2026, 17_25_16.png',
              'hurleur-de-nuit.png': 'ChatGPT Image 8 août 2026, 17_26_15(1).png',
              'croc-de-fer.png': 'ChatGPT Image 8 août 2026, 17_25_43(1).png',

              'meute-rassemblee.png': 'ChatGPT Image 8 août 2026, 17_24_43.png',
              'appel-de-la-lune.png': 'ChatGPT Image 8 août 2026, 17_25_00.png',
              'instinct-de-survie.png': 'ChatGPT Image 8 août 2026, 17_24_49.png',
              'morsure-sauvage.png': 'ChatGPT Image 8 août 2026, 17_25_07.png',
              'territoire-sacre.png': 'ChatGPT Image 8 août 2026, 17_24_01.png',
              'emprise-de-la-meute.png': 'ChatGPT Image 8 août 2026, 17_24_37.png',
              'lune-rouge.png': 'ChatGPT Image 8 août 2026, 17_24_31.png',
              'totem-alpha.png': 'ChatGPT Image 8 août 2026, 17_24_22.png',
              'pacte-des-crocs.png': 'ChatGPT Image 8 août 2026, 17_24_17.png',
              'derniere-trace.png': 'ChatGPT Image 8 août 2026, 17_24_08.png',

              'evo-louve-veilleuse.png': 'ChatGPT Image 8 août 2026, 17_23_45.png',
              'evo-loup-eclaireur.png': 'ChatGPT Image 8 août 2026, 17_20_15.png',
              'evo-jeune-croc.png': 'ChatGPT Image 8 août 2026, 17_22_03.png',
              'evo-loup-des-brumes.png': 'ChatGPT Image 8 août 2026, 17_25_23.png',
              'evo-chasseuse-grise.png': 'ChatGPT Image 8 août 2026, 17_23_53.png',
              'evo-loup-de-givre.png': 'ChatGPT Image 8 août 2026, 17_23_20.png',
              'evo-pisteur-alpha.png': 'ChatGPT Image 8 août 2026, 17_25_57(1).png',
              'evo-loup-sentinelle.png': 'ChatGPT Image 8 août 2026, 17_25_12.png',
              'evo-hurleur-de-nuit.png': 'ChatGPT Image 8 août 2026, 17_32_56(1).png',
              'evo-croc-de-fer.png': 'ChatGPT Image 8 août 2026, 17_26_27(1).png',

              'eclaireuse-des-crocs.png': 'ChatGPT Image 8 août 2026, 17_34_59(1).png',
              'chasseuse-des-ombres.png': 'ChatGPT Image 8 août 2026, 17_41_04(1).png',
              'meute-enragee.png': 'ChatGPT Image 8 août 2026, 17_45_48(1).png',
              'piege-de-givre.png': 'ChatGPT Image 8 août 2026, 17_47_11(1).png',
              'sang-pour-sang.png': 'ChatGPT Image 8 août 2026, 17_51_24(1).png',
              'rugissement-de-la-meute.png': 'ChatGPT Image 8 août 2026, 17_52_45(1).png',
              'mythique-loup-du-nexus.png': 'ChatGPT Image 8 août 2026, 18_14_08.png',
          }

          boosters = {
              'meute.png': 'ChatGPT Image 8 août 2026, 13_04_22.png',
              'chevalier.png': 'ChatGPT Image 8 août 2026, 13_06_04.png',
              'orc.png': 'ChatGPT Image 8 août 2026, 13_09_27.png',
              'dragon.png': 'ChatGPT Image 8 août 2026, 17_08_01.png',
              'gobelin.png': 'ChatGPT Image 8 août 2026, 17_11_17.png',
          }

          missing = [src for src in list(cards.values()) + list(boosters.values()) if src not in sources]
          if missing:
              raise SystemExit('ERREUR: fichiers source introuvables: ' + repr(missing))

          def optimize(src: Path, dst: Path, max_size=(1024, 1536)):
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  im.thumbnail(max_size, Image.Resampling.LANCZOS)
                  # PNG palette haute qualité, bien plus léger pour GitHub Pages/mobile.
                  im = im.quantize(colors=256, method=Image.Quantize.MEDIANCUT, dither=Image.Dither.FLOYDSTEINBERG)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  im.save(dst, format='PNG', optimize=True)

          for dst, src in cards.items():
              optimize(sources[src], root / 'public/cards' / dst)
              print('CARTE', dst, '<-', src)

          for dst, src in boosters.items():
              optimize(sources[src], root / 'public/boosters' / dst)
              print('BOOSTER', dst, '<-', src)

          if len(cards) != 37:
              raise SystemExit(f'ERREUR interne: {len(cards)} cartes au lieu de 37')
          if len(boosters) != 5:
              raise SystemExit(f'ERREUR interne: {len(boosters)} boosters au lieu de 5')
          PY

      - name: Installer l'habillage des boosters dans la boutique
        shell: bash
        run: |
          cat > public/booster-art.css <<'CSS'
          .shop-screen .options-grid > .options-card.nexus-booster-product {
            position: relative;
            overflow: visible;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, rgba(8,13,24,.84), rgba(4,7,14,.96));
            border: 1px solid rgba(255,255,255,.12);
            min-width: 0;
          }
          .nexus-booster-shop-art {
            width: min(100%, 240px);
            aspect-ratio: 2 / 3;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            filter: drop-shadow(0 18px 18px rgba(0,0,0,.48));
            transition: transform .2s ease, filter .2s ease;
          }
          .nexus-booster-product:hover .nexus-booster-shop-art {
            transform: translateY(-5px) scale(1.025);
            filter: drop-shadow(0 22px 24px rgba(0,0,0,.58));
          }
          .nexus-booster-product > b { margin-top: .45rem; font-size: 1.02rem; }
          .nexus-booster-product > p.hint,
          .nexus-booster-product > ul.booster-preview { display: none !important; }
          .nexus-booster-product .booster-buy-row { width: 100%; justify-content: center; }

          .booster-meute { background-image: url('./boosters/meute.png'); }
          .booster-chevalier { background-image: url('./boosters/chevalier.png'); }
          .booster-orc { background-image: url('./boosters/orc.png'); }
          .booster-dragon { background-image: url('./boosters/dragon.png'); }
          .booster-gobelin { background-image: url('./boosters/gobelin.png'); }

          .booster-pack-shell.nexus-real-pack {
            width: min(32vw, 300px) !important;
            height: min(48vw, 450px) !important;
            max-height: 52vh;
            background-color: transparent !important;
            background-repeat: no-repeat !important;
            background-size: contain !important;
            background-position: center !important;
            border: 0 !important;
            box-shadow: none !important;
            filter: drop-shadow(0 24px 24px rgba(0,0,0,.62));
          }
          .booster-pack-shell.nexus-real-pack::before,
          .booster-pack-shell.nexus-real-pack::after { content: none !important; display: none !important; }
          .booster-pack-shell.nexus-real-pack > * { visibility: hidden !important; }

          .booster-pull-card:has(.card.Rare) { filter: drop-shadow(0 0 12px rgba(60,150,255,.75)); }
          .booster-pull-card:has(.card.Épique) { filter: drop-shadow(0 0 18px rgba(175,70,255,.92)); }
          .booster-pull-card:has(.card.Légendaire) { filter: drop-shadow(0 0 21px rgba(255,190,40,.95)); }
          .booster-pull-card.mythic-pull,
          .booster-pull-card:has(.card.Mythique) { filter: drop-shadow(0 0 27px rgba(255,35,45,1)); }

          @media (max-width: 900px) {
            .nexus-booster-shop-art { width: min(100%, 180px); }
            .booster-pack-shell.nexus-real-pack { width: min(28vw, 220px) !important; height: min(42vw, 330px) !important; }
          }
          CSS

          cat > public/booster-art.js <<'JS'
          const FACTIONS = ['meute', 'chevalier', 'orc', 'dragon', 'gobelin'];
          const normalize = (value) => (value || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

          function decorateShop() {
            const grid = document.querySelector('.shop-screen .options-grid');
            if (!grid) return;
            const cards = [...grid.querySelectorAll(':scope > .options-card')].slice(0, 5);
            cards.forEach((card, index) => {
              const faction = FACTIONS[index];
              if (!faction || card.classList.contains('nexus-booster-product')) return;
              card.classList.add('nexus-booster-product');
              const art = document.createElement('div');
              art.className = `nexus-booster-shop-art booster-${faction}`;
              art.setAttribute('aria-hidden', 'true');
              card.insertBefore(art, card.firstChild);
            });
          }

          function decorateOpening() {
            document.querySelectorAll('.booster-opening-stage').forEach(stage => {
              const faction = normalize(stage.querySelector('header h3')?.textContent);
              if (!FACTIONS.includes(faction)) return;
              const shell = stage.querySelector('.booster-pack-shell');
              if (!shell) return;
              shell.classList.add('nexus-real-pack', `booster-${faction}`);
            });
          }

          function decorate() {
            decorateShop();
            decorateOpening();
          }

          const observer = new MutationObserver(decorate);
          observer.observe(document.documentElement, { childList: true, subtree: true });
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', decorate);
          else decorate();
          JS

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if 'booster-art.css' not in text:
              text = text.replace('</head>', '    <link rel="stylesheet" href="%BASE_URL%booster-art.css" />\n  </head>')
          if 'booster-art.js' not in text:
              text = text.replace('</body>', '    <script type="module" src="%BASE_URL%booster-art.js"></script>\n  </body>')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Nettoyer les archives de transfert
        shell: bash
        run: |
          rm -rf .nexus-assets-tmp
          rm -f Nexus_Images_Final_Lot_*.zip
          rm -f nexus_meute_pack.zip nexus_meute_tout.zip nexus_meute_github_parts.zip

      - name: Vérifications
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/cards -maxdepth 1 -type f -name '*.png' | grep -E '/(louve-veilleuse|loup-eclaireur|jeune-croc|loup-des-brumes|chasseuse-grise|loup-de-givre|pisteur-alpha|loup-sentinelle|hurleur-de-nuit|croc-de-fer|meute-rassemblee|appel-de-la-lune|instinct-de-survie|morsure-sauvage|territoire-sacre|emprise-de-la-meute|lune-rouge|totem-alpha|pacte-des-crocs|derniere-trace|evo-louve-veilleuse|evo-loup-eclaireur|evo-jeune-croc|evo-loup-des-brumes|evo-chasseuse-grise|evo-loup-de-givre|evo-pisteur-alpha|evo-loup-sentinelle|evo-hurleur-de-nuit|evo-croc-de-fer|eclaireuse-des-crocs|chasseuse-des-ombres|meute-enragee|piege-de-givre|sang-pour-sang|rugissement-de-la-meute|mythique-loup-du-nexus)\.png$' | wc -l)" -eq 37
          test "$(find public/boosters -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 5
          npm ci
          npm run build

      - name: Commit des nouveaux assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nexus Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Aucun changement à committer.'
            exit 0
          fi
          git commit -m "Intègre les 45 nouveaux visuels Meute et boosters"
          git push origin HEAD:main
