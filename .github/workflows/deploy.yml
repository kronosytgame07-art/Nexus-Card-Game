name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Installer les illustrations Meute
        run: |
          mkdir -p dist/cards
          cp "ChatGPT Image 5 août 2026, 16_00_27.png" dist/cards/louve-veilleuse.png
          cp "ChatGPT Image 5 août 2026, 16_15_51.png" dist/cards/loup-eclaireur.png
          cp "ChatGPT Image 5 août 2026, 16_07_50.png" dist/cards/jeune-croc.png
          cp "ChatGPT Image 5 août 2026, 16_23_37.png" dist/cards/loup-des-brumes.png
          cp "ChatGPT Image 5 août 2026, 17_10_51.png" dist/cards/chasseuse-grise.png
          cp "ChatGPT Image 5 août 2026, 17_01_36.png" dist/cards/loup-de-givre.png
          cp "ChatGPT Image 5 août 2026, 17_01_28.png" dist/cards/pisteur-alpha.png
          cp "ChatGPT Image 5 août 2026, 17_02_24.png" dist/cards/loup-sentinelle.png
          cp "GPT image-2026-08-05-17-04-33.png" dist/cards/hurleur-de-nuit.png
          cp "GPT image-2026-08-05-17-18-25.png" dist/cards/croc-de-fer.png
          cp "GPT image-2026-08-05-17-32-38.png" dist/cards/meute-rassemblee.png
          cp "GPT image-2026-08-05-17-34-33.png" dist/cards/appel-de-la-lune.png
          cp "GPT image-2026-08-05-17-36-10.png" dist/cards/morsure-sauvage.png
          cp "GPT image-2026-08-05-17-38-01.png" dist/cards/instinct-de-survie.png
          cp "GPT image-2026-08-05-17-44-52.png" dist/cards/territoire-sacre.png
          cp "FLUX-2026-08-05-17-56-51.jpeg" dist/cards/emprise-de-la-meute.png
          cp "ChatGPT Image 5 août 2026, 18_10_16.png" dist/cards/derniere-trace.png
          cp "ChatGPT Image 5 août 2026, 18_10_05.png" dist/cards/pacte-des-crocs.png
          cp "ChatGPT Image 5 août 2026, 18_09_58.png" dist/cards/totem-alpha.png
          cp "ChatGPT Image 5 août 2026, 18_09_51.png" dist/cards/lune-rouge.png
          cp "ChatGPT Image 5 août 2026, 18_16_20.png" dist/cards/evo-loup-des-brumes.png
          cp "ChatGPT Image 5 août 2026, 18_16_29.png" dist/cards/evo-jeune-croc.png
          cp "ChatGPT Image 5 août 2026, 18_16_37.png" dist/cards/evo-loup-eclaireur.png
          cp "ChatGPT Image 5 août 2026, 18_17_10.png" dist/cards/evo-louve-veilleuse.png
          cp "ChatGPT Image 5 août 2026, 18_36_55.png" dist/cards/evo-chasseuse-grise.png
          cp "ChatGPT Image 5 août 2026, 18_37_10.png" dist/cards/evo-loup-de-givre.png
          cp "ChatGPT Image 5 août 2026, 18_37_16.png" dist/cards/evo-pisteur-alpha.png
          cp "ChatGPT Image 5 août 2026, 18_37_22.png" dist/cards/evo-loup-sentinelle.png
          cp "ChatGPT Image 5 août 2026, 18_37_28.png" dist/cards/evo-hurleur-de-nuit.png
          cp "ChatGPT Image 5 août 2026, 18_37_35.png" dist/cards/evo-croc-de-fer.png
      - name: Installer les illustrations Chevalier
        run: |
          cp "ChatGPT Image 6 août 2026, 03_35_03.png" dist/cards/ecuyer-dore.png
          cp "ChatGPT Image 6 août 2026, 03_35_14.png" dist/cards/novice-du-serment.png
          cp "ChatGPT Image 6 août 2026, 03_43_44.png" dist/cards/lame-blanche.png
          cp "ChatGPT Image 6 août 2026, 03_44_26.png" dist/cards/garde-du-portail.png
          cp "ChatGPT Image 6 août 2026, 03_45_13.png" dist/cards/paladin-des-cendres.png
          cp "ChatGPT Image 6 août 2026, 03_46_00.png" dist/cards/chevalier-azur.png
          cp "ChatGPT Image 6 août 2026, 03_46_51.png" dist/cards/porte-etendard.png
          cp "ChatGPT Image 6 août 2026, 03_47_40.png" dist/cards/sentinelle-doree.png
          cp "ChatGPT Image 6 août 2026, 03_53_25.png" dist/cards/duelliste-royal.png
          cp "ChatGPT Image 6 août 2026, 03_54_22.png" dist/cards/capitaine-du-royaume.png
      - name: Installer les evolutions Chevalier
        run: |
          cp "ChatGPT Image 6 août 2026, 04_08_43.png" dist/cards/evo-novice-du-serment.png
          cp "ChatGPT Image 6 août 2026, 04_09_45.png" dist/cards/evo-lame-blanche.png
          cp "ChatGPT Image 6 août 2026, 04_10_59.png" dist/cards/evo-garde-du-portail.png
          cp "ChatGPT Image 6 août 2026, 04_11_57.png" dist/cards/evo-paladin-des-cendres.png
          cp "ChatGPT Image 6 août 2026, 04_12_54.png" dist/cards/evo-chevalier-azur.png
          cp "ChatGPT Image 6 août 2026, 04_13_53.png" dist/cards/evo-porte-etendard.png
          cp "ChatGPT Image 6 août 2026, 04_14_54.png" dist/cards/evo-sentinelle-doree.png
          cp "ChatGPT Image 6 août 2026, 04_15_53.png" dist/cards/evo-duelliste-royal.png
          cp "ChatGPT Image 6 août 2026, 04_16_53.png" dist/cards/evo-capitaine-du-royaume.png
          cp "ChatGPT Image 6 août 2026, 04_22_05.png" dist/cards/evo-ecuyer-dore.png
      - name: Installer les sorts et soutiens Chevalier
        run: |
          cp "ChatGPT Image 6 août 2026, 04_24_32.png" dist/cards/ordre-de-ralliement.png
          cp "ChatGPT Image 6 août 2026, 04_27_07.png" dist/cards/grande-bibliotheque.png
          cp "ChatGPT Image 6 août 2026, 04_28_14.png" dist/cards/bouclier-de-lumiere.png
          cp "ChatGPT Image 6 août 2026, 04_31_16.png" dist/cards/jugement-solaire.png
          cp "ChatGPT Image 6 août 2026, 04_32_07.png" dist/cards/banniere-du-royaume.png
          cp "ChatGPT Image 6 août 2026, 04_33_00.png" dist/cards/sceau-immobilite.png
          cp "ChatGPT Image 6 août 2026, 04_34_04.png" dist/cards/aube-victorieuse.png
          cp "ChatGPT Image 6 août 2026, 04_35_11.png" dist/cards/reliquaire-du-roi.png
          cp "ChatGPT Image 6 août 2026, 04_36_37.png" dist/cards/serment-de-garde.png
          cp "ChatGPT Image 6 août 2026, 04_37_26.png" dist/cards/voie-du-paladin.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
