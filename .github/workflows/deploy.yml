name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (avec la config Firebase si les secrets du dépôt sont renseignés — voir README.md)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      # Les illustrations sont maintenant versionnées directement dans public/cards
      # et public/boosters. Vite copie automatiquement public/ dans dist/ pendant
      # le build. Ne plus exécuter scripts/copy-card-art.sh ici : ce vieux script
      # écrasait les nouvelles illustrations Meute avec les assets du 5 août.
      - name: Vérifier les nouveaux assets Nexus
        run: |
          test -f dist/cards/louve-veilleuse.webp
          test -f dist/cards/mythique-loup-du-nexus.webp
          test -f dist/boosters/meute.webp
          echo "Nouvelles illustrations présentes dans le build."
      - name: Déployer sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
