name: Publier sur itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: itch-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build itch.io
        run: npm run build:itch
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Installer butler
        run: |
          set -euo pipefail
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d butler-bin
          chmod +x butler-bin/butler
          ./butler-bin/butler -V

      # Ne s'exécute que si le secret BUTLER_API_KEY est configuré (Settings > Secrets
      # and variables > Actions), pour ne pas faire échouer le workflow tant qu'il ne
      # l'est pas encore. Le contexte "secrets" n'est pas utilisable directement dans
      # un "if:" (non listé parmi les contextes disponibles pour les conditions) —
      # d'où le passage par la variable d'environnement du job ci-dessus.
      - name: Publier sur itch.io
        if: ${{ env.BUTLER_API_KEY != '' }}
        run: ./butler-bin/butler push dist-itch kronosttv/nexuscardarena:web --userversion "${{ github.sha }}"

      - name: Secret manquant
        if: ${{ env.BUTLER_API_KEY == '' }}
        run: |
          echo "::warning::BUTLER_API_KEY n'est pas configuré (Settings > Secrets and variables > Actions) — publication itch.io ignorée."
